# Blueprint de Render: https://render.com/docs/blueprint-spec
#
# IMPORTANTE: el servicio se despliega con Docker, no con un runtime nativo.
# Si en el dashboard el "Environment" dice Node, Python o similar, Render ignora
# este Dockerfile y usa su buildpack: por eso fallaba con
# "dotnet: command not found". El runtime debe ser Docker.
#
# Ojo con el nombre del campo: la spec actual usa "runtime: docker". El campo
# "env: docker" que aparece en tutoriales viejos esta deprecado y fue sustituido
# por "runtime", asi que no debe anadirse.
#
# Con runtime: docker no hace falta buildCommand ni startCommand: Render compila
# el Dockerfile y ejecuta su ENTRYPOINT, que ya escucha en $PORT.

services:
  - type: web
    name: incidencias-bici
    # "runtime" sustituye al campo deprecado "env". Este es el campo que obliga
    # a Render a construir la imagen del Dockerfile.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    # "autoDeployTrigger" sustituye al deprecado "autoDeploy: true"
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ---------- Redis (obligatoria: la app no arranca sin ella) ----------
      - key: ConnectionStrings__RedisConnection
        sync: false

      # ---------- Algolia ----------
      - key: Algolia__ApplicationId
        sync: false
      - key: Algolia__ApiKey
        sync: false
      # Necesaria para crear y sincronizar el indice. Sin ella la app arranca,
      # pero no escribe en Algolia (la Search API Key da 403 missing ACL).
      - key: Algolia__AdminApiKey
        sync: false
      - key: Algolia__IndexName
        value: incidencias

      # ---------- PieHost (PieSocket) ----------
      - key: PieSocket__ApiKey
        sync: false
      - key: PieSocket__ApiSecret
        sync: false
      - key: PieSocket__ClusterId
        sync: false
      - key: PieSocket__RoomId
        sync: false

# Si montas un disco persistente, descomenta y ajusta la ruta en el panel con
# ConnectionStrings__DefaultConnection = "Data Source=/var/data/incidencias.db"
#
# disk:
#   name: incidencias-data
#   mountPath: /var/data
#   sizeGB: 1
